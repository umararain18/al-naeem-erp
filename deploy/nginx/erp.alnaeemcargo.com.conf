# ============================================================
# TEMPLATE ONLY — not applied to any live Nginx configuration by this
# repository. This file is NOT read by Nginx from inside the project;
# it exists here purely as a reviewable template. To actually use it,
# a human with server access must copy it onto the VPS:
#
#   sudo cp deploy/nginx/erp.alnaeemcargo.com.conf \
#           /etc/nginx/sites-available/erp.alnaeemcargo.com
#   sudo ln -s /etc/nginx/sites-available/erp.alnaeemcargo.com \
#              /etc/nginx/sites-enabled/erp.alnaeemcargo.com
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL is deliberately NOT configured here, per this task's explicit
# scope ("Do not configure SSL yet"). This is HTTP-only on port 80.
#
# IMPORTANT (see docs/PRODUCTION_DEPLOYMENT.md): the app's login
# cookie is marked `Secure` whenever NODE_ENV=production (see
# app/api/auth/login/route.ts), which means login will NOT work
# correctly over plain HTTP once the app itself runs with
# NODE_ENV=production. SSL (certbot/Let's Encrypt, a separate step)
# must be added before the site is usable end-to-end on this domain.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name erp.alnaeemcargo.com;

    # Next.js's own build output already serves static assets
    # (including public/uploads/branding/ — see
    # docs/PRODUCTION_DEPLOYMENT.md's upload-persistence note)
    # through the same Node process, so nothing special is needed
    # here beyond a plain reverse proxy to it.

    client_max_body_size 10m;  # branding/signature/stamp uploads are capped at 5MB app-side; this just avoids Nginx rejecting them first.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev-mode HMR needs Upgrade/Connection headers; a
        # production `next start` server doesn't use websockets, but
        # these are harmless to keep in case that changes, and cost
        # nothing.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/erp.alnaeemcargo.com.access.log;
    error_log  /var/log/nginx/erp.alnaeemcargo.com.error.log;
}
